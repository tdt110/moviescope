<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Discovery App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="brand"><span class="logo-dot"></span> MovieHub</div>

  <div class="header-links">
    <a href="https://tdt110.github.io/bt35-lap-trinh-web/" target="_blank" rel="noopener">Bài tập 35</a>
    <a href="https://tdt110.github.io/bt36-javascript-ltw/bt36.html" target="_blank" rel="noopener">Bài tập 36</a>
    <label class="theme-switch">
      <span>🌙</span>
      <input type="checkbox" id="themeToggle">
      <span class="switch-track"></span>
    </label>
  </div>
</header>

<div class="app-layout">
  <!-- SIDEBAR: bộ lọc thể loại + tìm kiếm -->
  <aside class="sidebar">
    <h2>Tìm kiếm</h2>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Nhập tên phim...">
    </div>

    <h2>Thể loại</h2>
    <div id="genreList"><!-- JS tự sinh checkbox theo dữ liệu phim --></div>

    <button class="clear-btn" id="clearFilters">Xóa bộ lọc</button>
  </aside>

  <!-- MAIN: danh sách phim -->
  <main class="main-content">
    <h1>Khám phá phim</h1>
    <p class="subtitle"><span id="resultCount">0 phim</span> đang hiển thị</p>

    <div class="movie-grid" id="movieGrid"><!-- JS render movie cards --></div>

    <div class="empty-state" id="emptyState" hidden>
      <span class="emoji">🎬</span>
      Không tìm thấy phim phù hợp. Hãy thử từ khóa hoặc bộ lọc khác.
    </div>
  </main>
</div>

<footer class="site-footer">
  © 2026 MovieHub — Đồ án cuối kỳ Lập trình Web (Đề DE04)
</footer>

<!-- MODAL chi tiết phim -->
<div class="modal-overlay" id="movieModal" aria-hidden="true">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="Đóng">✕</button>
    <div id="modalBody"><!-- JS render chi tiết phim --></div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
